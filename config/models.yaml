providers:
  nvidia:
    base_url: https://integrate.api.nvidia.com/v1
    env_var: NVIDIA_API_KEY
  nine_router:
    base_url: https://integrate.api.nvidia.com/v1
    env_var: NINE_ROUTER_API_KEY
  anthropic:
    env_var: ANTHROPIC_API_KEY
  openai:
    env_var: OPENAI_API_KEY
  cli_agy:
    mode: cli
  cli_codex:
    mode: cli
roles:
  strong:
    provider: cli_agy
    name: gemini-4-neon-xhigh
  fast:
    provider: cli_agy
    name: gemini-4-neon-xhigh
fallbacks:
  strong:
  - provider: cli_codex
    name: gpt-6.1-sol
  fast:
  - provider: cli_agy
    name: gemini-4-neon-xhigh
